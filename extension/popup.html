<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 320px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: #09090b;
        color: #f4f4f5;
        margin: 0;
        padding: 16px;
      }
      .card {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .logo {
        font-size: 18px;
        font-weight: 700;
        color: #6366f1;
      }
      .logo span {
        color: #f4f4f5;
      }
      .subtitle {
        font-size: 12px;
        color: #a1a1aa;
        margin: -8px 0 0 0;
      }
      .btn {
        background-color: #6366f1;
        color: white;
        border: none;
        padding: 10px 14px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: background-color 0.2s ease;
        text-align: center;
      }
      .btn:hover {
        background-color: #4f46e5;
      }
      .btn:disabled {
        background-color: #27272a;
        color: #71717a;
        cursor: not-allowed;
      }
      .status {
        font-size: 12px;
        padding: 8px;
        border-radius: 6px;
        display: none;
      }
      .status.success {
        display: block;
        background-color: #064e3b;
        color: #34d399;
        border: 1px solid #065f46;
      }
      .status.error {
        display: block;
        background-color: #7f1d1d;
        color: #fca5a5;
        border: 1px solid #991b1b;
      }
      .status.loading {
        display: block;
        background-color: #18181b;
        color: #e4e4e7;
        border: 1px solid #27272a;
      }
      .divider {
        height: 1px;
        background-color: #27272a;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="header">
        <div class="logo">Jobbly<span>Clipper</span></div>
      </div>
      <p class="subtitle">Clip job postings from active tabs directly into your tracker.</p>
      <div class="divider"></div>
      
      <button id="clip-btn" class="btn">Clip Current Job</button>
      
      <div id="status-box" class="status"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
